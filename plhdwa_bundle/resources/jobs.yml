# =====================================================================================================
# Jobs do PLHDWA. Todos serverless, com a tag OWNER, sem nova tentativa automática
# (erro = objeto travado + alerta por e-mail; a retomada é feita pelo DESBLOQUEIO).
# Os parâmetros de cada job vêm das variáveis do bundle (databricks.yml); a descrição de cada um está na
# tabela PARAMETROS de src/plhdwa_motor.py. job_id e job_run_id vêm das referências dinâmicas do Jobs.
# =====================================================================================================
resources:
  jobs:

    # -------------------------------------------------------------------------------------------------
    # Despachante: disparado pela chegada de CTL na pasta pasta_ctl da landing. Cada execução = 1 lote (1 por vez; disparos
    # durante o lote esperam na fila do Jobs). Objetos DESPACHANTE rodam aqui (threads, 1 arquivo por vaga);
    # objetos JOB disparam os jobs de carga abaixo.
    plhdwa_despachante:
      name: PLHDWA · despachante
      tags: {OWNER: "${var.owner_tag}"}
      performance_target: PERFORMANCE_OPTIMIZED
      max_concurrent_runs: 1
      queue: {enabled: true}
      trigger:
        file_arrival:
          url: ${var.landing}/${var.pasta_ctl}/
          min_time_between_triggers_seconds: ${var.gatilho_intervalo_s}
      email_notifications:
        on_failure: ["${var.email_alertas}"]
      parameters:
        - {name: catalogo, default: "${var.catalogo}"}
        - {name: schema, default: "${var.schema}"}
        - {name: landing, default: "${var.landing}"}
        - {name: landing_tipo, default: "${var.landing_tipo}"}
        - {name: pasta_dat, default: "${var.pasta_dat}"}
        - {name: pasta_ctl, default: "${var.pasta_ctl}"}
        - {name: pasta_erro, default: "${var.pasta_erro}"}
        - {name: pasta_tmp, default: "${var.pasta_tmp}"}
        - {name: fuso_horario, default: "${var.fuso_horario}"}
        - {name: usar_db2, default: "${var.usar_db2}"}
        - {name: mover_invalido_min, default: "${var.mover_invalido_min}"}
        - {name: db2_modo, default: "${var.db2_modo}"}
        - {name: db2_host, default: "${var.db2_host}"}
        - {name: db2_porta, default: "${var.db2_porta}"}
        - {name: db2_banco, default: "${var.db2_banco}"}
        - {name: db2_ssl, default: "${var.db2_ssl}"}
        - {name: db2_certificado, default: "${var.db2_certificado}"}
        - {name: db2_extra, default: "${var.db2_extra}"}
        - {name: db2_secret_scope, default: "${var.db2_secret_scope}"}
        - {name: db2_chave_usuario, default: "${var.db2_chave_usuario}"}
        - {name: db2_chave_senha, default: "${var.db2_chave_senha}"}
        - {name: db2_tabela, default: "${var.db2_tabela}"}
        - {name: db2_comando, default: "${var.db2_comando}"}
        - {name: db2_timeout_s, default: "${var.db2_timeout_s}"}
        - {name: db2_mensagem_max, default: "${var.db2_mensagem_max}"}
        - {name: db2_max_conexoes, default: "${var.db2_max_conexoes}"}
        - {name: lakebase_instance, default: "${var.lakebase_instance}"}
        - {name: lakebase_database, default: "${var.lakebase_database}"}
        - {name: lakebase_tabela, default: "${var.lakebase_tabela}"}
        - {name: db2_tentativas, default: "${var.db2_tentativas}"}
        - {name: db2_espera_base_s, default: "${var.db2_espera_base_s}"}
        - {name: db2_registrar_inicio, default: "${var.db2_registrar_inicio}"}
        - {name: limpeza_dat, default: "${var.limpeza_dat}"}
        - {name: limpeza_pedaco_mb, default: "${var.limpeza_pedaco_mb}"}
        - {name: precheck_linhas, default: "${var.precheck_linhas}"}
        - {name: precheck_min_mb, default: "${var.precheck_min_mb}"}
        - {name: ciclo_s, default: "${var.ciclo_s}"}
        - {name: max_horas, default: "${var.max_horas}"}
        - {name: max_threads, default: "${var.max_threads}"}
        - {name: tipo_job, default: PERFORMANCE_OPTIMIZED}
      # Ambiente serverless dos notebooks: dependências instaladas antes de o notebook começar (sem pip no código).
      # Versão FIXA na variável serverless_ambiente (padrão "1"): o driver do Db2 (ibm-db) só tem pacote para
      # x86_64 e, nas versões mais novas, o job às vezes cai em máquina ARM e falha na instalação.
      environments: &ambiente_plhdwa
        - environment_key: plhdwa
          spec:
            environment_version: "${var.serverless_ambiente}"
            dependencies:
              - "ibm-db"                # controle no Db2 (driver oficial da IBM)
              - "databricks-sdk>=0.65"  # Jobs / Lakebase
              - "pg8000>=1.31"          # controle simulada no Lakebase (db2_modo = SIMULADO)
      tasks:
        - task_key: despachar
          max_retries: 0
          environment_key: plhdwa
          notebook_task:
            notebook_path: ../src/despachante.py
            base_parameters: {job_id: "{{job.id}}", job_run_id: "{{job.run_id}}"}

    # -------------------------------------------------------------------------------------------------
    # Job independente (objetos com execucao = JOB na ctl_parametros), tipo Performance Optimized: começa no arquivo
    # recebido do despachante e segue com os próximos do mesmo objeto (até job_max_arquivos / job_max_minutos).
    plhdwa_carga_arquivo_perf:
      name: PLHDWA · carga arquivo · performance
      tags: {OWNER: "${var.owner_tag}"}
      performance_target: PERFORMANCE_OPTIMIZED
      max_concurrent_runs: 100           # o limite efetivo é max_simult do modo JOB (ctl_execucao)
      queue: {enabled: true}
      email_notifications:
        on_failure: ["${var.email_alertas}"]
      parameters: &parametros_carga
        - {name: ctl, default: ""}                 # passados pelo despachante no run_now
        - {name: modo, default: "JOB"}
        - {name: lote_id, default: "0"}
        - {name: max_arquivos, default: "${var.job_max_arquivos}"}
        - {name: max_minutos, default: "${var.job_max_minutos}"}
        - {name: catalogo, default: "${var.catalogo}"}
        - {name: schema, default: "${var.schema}"}
        - {name: landing, default: "${var.landing}"}
        - {name: landing_tipo, default: "${var.landing_tipo}"}
        - {name: pasta_dat, default: "${var.pasta_dat}"}
        - {name: pasta_ctl, default: "${var.pasta_ctl}"}
        - {name: pasta_erro, default: "${var.pasta_erro}"}
        - {name: pasta_tmp, default: "${var.pasta_tmp}"}
        - {name: fuso_horario, default: "${var.fuso_horario}"}
        - {name: usar_db2, default: "${var.usar_db2}"}
        - {name: mover_invalido_min, default: "${var.mover_invalido_min}"}
        - {name: db2_modo, default: "${var.db2_modo}"}
        - {name: db2_host, default: "${var.db2_host}"}
        - {name: db2_porta, default: "${var.db2_porta}"}
        - {name: db2_banco, default: "${var.db2_banco}"}
        - {name: db2_ssl, default: "${var.db2_ssl}"}
        - {name: db2_certificado, default: "${var.db2_certificado}"}
        - {name: db2_extra, default: "${var.db2_extra}"}
        - {name: db2_secret_scope, default: "${var.db2_secret_scope}"}
        - {name: db2_chave_usuario, default: "${var.db2_chave_usuario}"}
        - {name: db2_chave_senha, default: "${var.db2_chave_senha}"}
        - {name: db2_tabela, default: "${var.db2_tabela}"}
        - {name: db2_comando, default: "${var.db2_comando}"}
        - {name: db2_timeout_s, default: "${var.db2_timeout_s}"}
        - {name: db2_mensagem_max, default: "${var.db2_mensagem_max}"}
        - {name: db2_max_conexoes, default: "${var.db2_max_conexoes}"}
        - {name: lakebase_instance, default: "${var.lakebase_instance}"}
        - {name: lakebase_database, default: "${var.lakebase_database}"}
        - {name: lakebase_tabela, default: "${var.lakebase_tabela}"}
        - {name: db2_tentativas, default: "${var.db2_tentativas}"}
        - {name: db2_espera_base_s, default: "${var.db2_espera_base_s}"}
        - {name: db2_registrar_inicio, default: "${var.db2_registrar_inicio}"}
        - {name: limpeza_dat, default: "${var.limpeza_dat}"}
        - {name: limpeza_pedaco_mb, default: "${var.limpeza_pedaco_mb}"}
        - {name: precheck_linhas, default: "${var.precheck_linhas}"}
        - {name: precheck_min_mb, default: "${var.precheck_min_mb}"}
      environments: *ambiente_plhdwa
      tasks:
        - task_key: carregar
          max_retries: 0
          environment_key: plhdwa
          notebook_task:
            notebook_path: ../src/carga_arquivo.py
            base_parameters: {job_id: "{{job.id}}", job_run_id: "{{job.run_id}}", tipo_job: PERFORMANCE_OPTIMIZED}

    # Mesmo código, tipo Standard (mais barato; arranque mais lento): objetos com tipo_job = STANDARD na ctl_parametros
    plhdwa_carga_arquivo_std:
      name: PLHDWA · carga arquivo · standard
      tags: {OWNER: "${var.owner_tag}"}
      performance_target: ${var.desempenho_job_std}
      max_concurrent_runs: 100
      queue: {enabled: true}
      email_notifications:
        on_failure: ["${var.email_alertas}"]
      parameters: *parametros_carga
      environments: *ambiente_plhdwa
      tasks:
        - task_key: carregar
          max_retries: 0
          environment_key: plhdwa
          notebook_task:
            notebook_path: ../src/carga_arquivo.py
            base_parameters: {job_id: "{{job.id}}", job_run_id: "{{job.run_id}}", tipo_job: STANDARD}

    # -------------------------------------------------------------------------------------------------
    # Vigia: rede de segurança agendada. Religa o despachante se houver CTL parado (ex.: depois de um
    # DESBLOQUEIO, que não gera arquivo novo e por isso não dispara o gatilho).
    plhdwa_vigia:
      name: PLHDWA · vigia
      tags: {OWNER: "${var.owner_tag}"}
      performance_target: ${var.desempenho_vigia}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "${var.vigia_cron}"
        timezone_id: ${var.fuso_horario}
        pause_status: UNPAUSED
      parameters:
        - {name: catalogo, default: "${var.catalogo}"}
        - {name: schema, default: "${var.schema}"}
        - {name: landing, default: "${var.landing}"}
        - {name: landing_tipo, default: "${var.landing_tipo}"}
        - {name: pasta_dat, default: "${var.pasta_dat}"}
        - {name: pasta_ctl, default: "${var.pasta_ctl}"}
        - {name: pasta_erro, default: "${var.pasta_erro}"}
        - {name: pasta_tmp, default: "${var.pasta_tmp}"}
        - {name: fuso_horario, default: "${var.fuso_horario}"}
        - {name: vigia_parado_min, default: "${var.vigia_parado_min}"}
        - {name: listagem_espera_s, default: "${var.vigia_retry_espera_s}"}
        - {name: mover_invalido_min, default: "${var.mover_invalido_min}"}
        - {name: despachante_job_id, default: "${resources.jobs.plhdwa_despachante.id}"}
      # Ambiente leve: o vigia só lista a pasta de CTL e consulta/dispara o despachante (databricks-sdk já vem no
      # serverless). Sem ibm-db/pg8000, não há instalação de bibliotecas no arranque.
      environments:
        - environment_key: plhdwa_leve
          spec:
            environment_version: "${var.serverless_ambiente}"
      tasks:
        - task_key: vigiar
          max_retries: 0
          environment_key: plhdwa_leve
          notebook_task:
            notebook_path: ../src/vigia.py

    # -------------------------------------------------------------------------------------------------
    # Instalação / pós-deploy: rodar depois de cada deploy (idempotente). Cria tabelas e visões
    # (sql/01_tabelas_operacionais.sql), grava os jobs em ctl_execucao, prepara a controle e dá os GRANTs.
    plhdwa_pos_deploy:
      name: PLHDWA · instalação e pós-deploy
      tags: {OWNER: "${var.owner_tag}"}
      performance_target: PERFORMANCE_OPTIMIZED
      environments: *ambiente_plhdwa
      tasks:
        - task_key: pos_deploy
          max_retries: 0
          environment_key: plhdwa
          notebook_task:
            notebook_path: ../src/pos_deploy.py
            base_parameters:
              catalogo: "${var.catalogo}"
              schema: "${var.schema}"
              owner_tag: "${var.owner_tag}"
              max_simult_despachante: "${var.max_simult_despachante}"
              max_simult_job: "${var.max_simult_job}"
              job_perf: "${resources.jobs.plhdwa_carga_arquivo_perf.id}"
              job_std: "${resources.jobs.plhdwa_carga_arquivo_std.id}"
              usar_db2: "${var.usar_db2}"
              db2_modo: "${var.db2_modo}"
              lakebase_instance: "${var.lakebase_instance}"
              lakebase_database: "${var.lakebase_database}"
              lakebase_tabela: "${var.lakebase_tabela}"
              grupo_owner: "${var.grupo_owner}"

    # -------------------------------------------------------------------------------------------------
    # Testes (opcionais; não rodam sozinhos)
    plhdwa_validar_testes:
      name: PLHDWA · validar testes
      tags: {OWNER: "${var.owner_tag}"}
      performance_target: PERFORMANCE_OPTIMIZED
      parameters:
        - {name: manifesto, default: "${var.landing}/testes/manifesto_todos.csv"}
        - {name: owner_tag, default: "${var.owner_tag}"}
        - {name: catalogo, default: "${var.catalogo}"}
        - {name: schema, default: "${var.schema}"}
        - {name: landing, default: "${var.landing}"}
        - {name: landing_tipo, default: "${var.landing_tipo}"}
        - {name: pasta_dat, default: "${var.pasta_dat}"}
        - {name: pasta_ctl, default: "${var.pasta_ctl}"}
        - {name: pasta_erro, default: "${var.pasta_erro}"}
        - {name: pasta_tmp, default: "${var.pasta_tmp}"}
        - {name: fuso_horario, default: "${var.fuso_horario}"}
        - {name: usar_db2, default: "${var.usar_db2}"}
        - {name: mover_invalido_min, default: "${var.mover_invalido_min}"}
        - {name: db2_modo, default: "${var.db2_modo}"}
        - {name: db2_host, default: "${var.db2_host}"}
        - {name: db2_porta, default: "${var.db2_porta}"}
        - {name: db2_banco, default: "${var.db2_banco}"}
        - {name: db2_ssl, default: "${var.db2_ssl}"}
        - {name: db2_certificado, default: "${var.db2_certificado}"}
        - {name: db2_extra, default: "${var.db2_extra}"}
        - {name: db2_secret_scope, default: "${var.db2_secret_scope}"}
        - {name: db2_chave_usuario, default: "${var.db2_chave_usuario}"}
        - {name: db2_chave_senha, default: "${var.db2_chave_senha}"}
        - {name: db2_tabela, default: "${var.db2_tabela}"}
        - {name: db2_comando, default: "${var.db2_comando}"}
        - {name: db2_timeout_s, default: "${var.db2_timeout_s}"}
        - {name: db2_mensagem_max, default: "${var.db2_mensagem_max}"}
        - {name: db2_max_conexoes, default: "${var.db2_max_conexoes}"}
        - {name: lakebase_instance, default: "${var.lakebase_instance}"}
        - {name: lakebase_database, default: "${var.lakebase_database}"}
        - {name: lakebase_tabela, default: "${var.lakebase_tabela}"}
      environments: *ambiente_plhdwa
      tasks:
        - task_key: validar
          max_retries: 0
          environment_key: plhdwa
          notebook_task:
            notebook_path: ../src/validar_testes.py

    # Conexão e comando da controle no Db2 (rodar antes da 1ª carga e a cada mudança de Db2/tabela/comando)
    plhdwa_testar_controle_db2:
      name: PLHDWA · testar controle Db2
      tags: {OWNER: "${var.owner_tag}"}
      performance_target: PERFORMANCE_OPTIMIZED
      parameters:
        - {name: objeto_teste, default: ""}   # vazio = não grava nada; um código = executa os UPDATE de verdade nele
        - {name: catalogo, default: "${var.catalogo}"}
        - {name: schema, default: "${var.schema}"}
        - {name: landing, default: "${var.landing}"}
        - {name: landing_tipo, default: "${var.landing_tipo}"}
        - {name: pasta_dat, default: "${var.pasta_dat}"}
        - {name: pasta_ctl, default: "${var.pasta_ctl}"}
        - {name: pasta_erro, default: "${var.pasta_erro}"}
        - {name: pasta_tmp, default: "${var.pasta_tmp}"}
        - {name: fuso_horario, default: "${var.fuso_horario}"}
        - {name: usar_db2, default: "${var.usar_db2}"}
        - {name: mover_invalido_min, default: "${var.mover_invalido_min}"}
        - {name: db2_modo, default: "${var.db2_modo}"}
        - {name: db2_host, default: "${var.db2_host}"}
        - {name: db2_porta, default: "${var.db2_porta}"}
        - {name: db2_banco, default: "${var.db2_banco}"}
        - {name: db2_ssl, default: "${var.db2_ssl}"}
        - {name: db2_certificado, default: "${var.db2_certificado}"}
        - {name: db2_extra, default: "${var.db2_extra}"}
        - {name: db2_secret_scope, default: "${var.db2_secret_scope}"}
        - {name: db2_chave_usuario, default: "${var.db2_chave_usuario}"}
        - {name: db2_chave_senha, default: "${var.db2_chave_senha}"}
        - {name: db2_tabela, default: "${var.db2_tabela}"}
        - {name: db2_comando, default: "${var.db2_comando}"}
        - {name: db2_timeout_s, default: "${var.db2_timeout_s}"}
        - {name: db2_mensagem_max, default: "${var.db2_mensagem_max}"}
        - {name: db2_max_conexoes, default: "${var.db2_max_conexoes}"}
        - {name: db2_registrar_inicio, default: "${var.db2_registrar_inicio}"}
      environments: *ambiente_plhdwa
      tasks:
        - task_key: testar
          max_retries: 0
          environment_key: plhdwa
          notebook_task:
            notebook_path: ../src/testar_controle_db2.py

    plhdwa_gerar_teste_tempo:
      name: PLHDWA · gerar arquivo grande (teste de tempo)
      tags: {OWNER: "${var.owner_tag}"}
      performance_target: PERFORMANCE_OPTIMIZED
      parameters:
        - {name: landing, default: "${var.landing}"}
        - {name: pasta_dat, default: "${var.pasta_dat}"}
        - {name: pasta_ctl, default: "${var.pasta_ctl}"}
        - {name: preparo, default: ""}           # landing no S3: pasta num volume para gerar o arquivo
        - {name: tamanho_mb, default: "5120"}
        - {name: cod_objeto, default: "9050"}
      environments: *ambiente_plhdwa
      tasks:
        - task_key: gerar
          max_retries: 0
          environment_key: plhdwa
          notebook_task:
            notebook_path: ../src/gerar_teste_tempo.py
