# =====================================================================================================
# PLHDWA · motor de carga Netezza -> Databricks (Databricks Asset Bundle)
#
# Para instalar num ambiente: preencha as variáveis do target (dev, hml ou prd) abaixo e rode
#   databricks bundle deploy -t <target>
#   databricks bundle run plhdwa_pos_deploy -t <target>      # cria tabelas/visões, grava os jobs, controle
# Tudo o que muda de um ambiente para outro é variável: nada fica fixo no código.
# Passo a passo completo: README.md.
# =====================================================================================================
bundle:
  name: plhdwa

include:
  - resources/*.yml
  - targets/*.yml            # targets extras (opcional): um arquivo por ambiente, se preferir separar

workspace:
  # Pasta do bundle no workspace, na área do service principal que executa os jobs (run_as dos targets)
  root_path: /Workspace/Users/${var.svc_hash}/.bundle/${bundle.name}/${bundle.target}
  artifact_path: /Workspace/Users/${var.svc_hash}/.bundle/${bundle.name}/${bundle.target}/artifacts
  file_path: /Workspace/Users/${var.svc_hash}/.bundle/${bundle.name}/${bundle.target}/files

variables:
  # ------------------------------------------------------------------ identidade
  svc_hash:
    description: >-
      Hash (application ID) do service principal da área, que executa os jobs (run_as) e cria os recursos. Sem
      padrão e não definido nos targets: vem do CI/CD (--var svc_hash=... ou BUNDLE_VAR_svc_hash); sem ele o deploy para.

  # ------------------------------------------------------------------ onde ficam as coisas
  catalogo:
    description: Catálogo das tabelas operacionais do PLHDWA (log, lotes, controle). Precisa existir.
  schema:
    description: Schema das tabelas operacionais (criado pelo pós-deploy se não existir)
    default: plhdwa
  landing_tipo:
    description: >-
      Onde o Netezza grava os arquivos. S3 (padrão) = direto no bucket: landing = s3://<bucket>/<prefixo>, acessado
      pela external location do Unity Catalog que cobre esse caminho (sem volume). VOLUME = volume do Unity Catalog:
      landing = /Volumes/<catalogo>/<schema>/<volume>/<pasta>. O motor confere se landing combina com o tipo.
    default: S3
  landing:
    description: >-
      Prefixo da landing; as pastas pasta_dat, pasta_ctl, pasta_erro e pasta_tmp ficam dentro dele. Com landing_tipo = S3:
      s3://<bucket>/<prefixo> (precisa de uma external location com file events cobrindo o caminho; a identidade
      dos jobs precisa de READ FILES e WRITE FILES nela). Com VOLUME: /Volumes/<catalogo>/<schema>/<volume>/<pasta>.
  pasta_dat:
    description: >-
      Pasta dos arquivos .dat, dentro de landing (por exemplo s3://<bucket>/<prefixo>/dados)
    default: dados
  pasta_ctl:
    description: Pasta dos arquivos .CTL, dentro de landing. O gatilho do despachante olha esta pasta.
    default: ctl
  pasta_erro:
    description: Pasta para onde o motor move o par (CTL e DAT) com erro de negócio, dentro de landing
    default: erro
  pasta_tmp:
    description: >-
      Pasta de trabalho temporário do cliente, dentro de landing. O motor não lê nem grava nela (só confere que
      é diferente das outras); como o gatilho olha só pasta_ctl, arquivos aqui não disparam nada.
    default: tmp
  warehouse_id:
    description: SQL warehouse dos dashboards
  fuso_horario:
    description: Fuso das datas de geração dos nomes de arquivo e dos horários gravados no log
    default: America/Sao_Paulo

  # ------------------------------------------------------------------ controle (Db2)
  usar_db2:
    description: >-
      "sim" (padrão) = executa as etapas da controle no Db2: grava CONCLUIDO ou ERRO de cada arquivo (e
      EM_PROCESSAMENTO, com db2_registrar_inicio = "true"). "nao" = não executa nenhuma etapa do Db2: não conecta,
      não grava a controle e o log não tem CONFIRMADO_DB2; o resto da carga é igual. Com "nao", as variáveis db2_*
      podem ficar vazias.
    default: "sim"
  db2_modo:
    description: >-
      DB2 = controle no Db2 do cliente (padrão). SIMULADO = controle numa instância Lakebase, só para testar
      o motor sem Db2 (nesse caso preencha as variáveis lakebase_*).
    default: DB2
  db2_host:
    description: Host do Db2 (o serverless chega nele pela NCC / rota de rede do workspace)
    default: ""
  db2_porta:
    description: Porta do Db2
    default: "50000"
  db2_banco:
    description: Nome do banco (DATABASE) no Db2
    default: ""
  db2_ssl:
    description: true = conexão com SSL (SECURITY=SSL)
    default: "true"
  db2_certificado:
    description: >-
      (opcional) arquivo da CA do certificado do Db2, num volume (ex.: /Volumes/.../config/db2_ca.arm ou .pem).
      Necessário se o Db2 usa certificado de CA própria/interna (opção SSLServerCertificate do ibm_db).
    default: ""
  db2_extra:
    description: (opcional) opções extras da conexão ibm_db, no formato CHAVE=valor;CHAVE=valor;
    default: ""
  db2_secret_scope:
    description: Secret scope com o usuário e a senha do Db2 (nunca coloque senha em variável)
    default: plhdwa
  db2_chave_usuario:
    description: Chave do usuário do Db2 no secret scope
    default: db2_usuario
  db2_chave_senha:
    description: Chave da senha do Db2 no secret scope
    default: db2_senha
  db2_tabela:
    description: schema.tabela da controle no Db2
    default: ""
  db2_comando:
    description: >-
      Arquivo em sql/ com os UPDATE da controle, um por status (seções -- [CONCLUIDO], -- [ERRO] e, só com
      db2_registrar_inicio = true, -- [EM_PROCESSAMENTO]). Só UPDATE é aceito: o motor nunca insere nem apaga.
      Padrão: os comandos oficiais do cliente (02_db2_controle_update.sql).
    default: 02_db2_controle_update.sql
  db2_timeout_s:
    description: >-
      Segundos de espera para conectar no Db2 e por lock na tabela da controle. Passou disso, a tentativa falha
      com a mensagem do Db2 (e conta em db2_tentativas), em vez de o job ficar esperando sem fim.
    default: "30"
  db2_mensagem_max:
    description: Tamanho máximo da mensagem de erro enviada ao Db2 (o tamanho da coluna da controle)
    default: "500"
  lakebase_instance:
    description: (só db2_modo = SIMULADO) instância Lakebase da controle simulada
    default: ""
  lakebase_database:
    description: (só db2_modo = SIMULADO) banco da controle simulada no Lakebase (criado pelo pós-deploy)
    default: plhdwa
  lakebase_tabela:
    description: (só db2_modo = SIMULADO) schema.tabela da controle simulada no Lakebase (criada pelo pós-deploy)
    default: controle.db2_controle
  db2_max_conexoes:
    description: >-
      Conexões simultâneas com o Db2 por processo (as threads do despachante compartilham). Total no Db2 =
      este valor (despachante) + 1 por job independente em execução. Respeite o limite de conexões do Db2.
    default: "8"
  db2_tentativas:
    description: Tentativas de gravar na controle antes de ERRO_DB2
    default: "3"
  db2_espera_base_s:
    description: Espera (s) antes da 2ª tentativa na controle; dobra a cada tentativa
    default: "30"
  db2_registrar_inicio:
    description: >-
      "false" (padrão) = o Db2 só recebe o fim de cada arquivo (CONCLUIDO ou ERRO); o início fica no log
      do Databricks. "true" = grava também EM_PROCESSAMENTO antes da carga, e o arquivo só é carregado se o Db2
      aceitar (com o Db2 fora, nada é carregado).
    default: "false"

  # ------------------------------------------------------------------ execução
  max_simult_despachante:
    description: >-
      Vagas iniciais do modo DESPACHANTE (objetos em paralelo dentro do despachante). Só vale na 1ª
      instalação; depois, o owner ajusta direto em ctl_execucao.
    default: "24"
  max_simult_job:
    description: Vagas iniciais do modo JOB (jobs independentes em paralelo). Idem.
    default: "24"
  serverless_ambiente:
    description: >-
      Versão do ambiente serverless dos jobs (environment_version). Fixa em "1": o driver do Db2 (ibm-db) só tem
      pacote para x86_64, e nas versões mais novas a plataforma às vezes aloca máquina ARM (aarch64), onde a
      instalação falha e o job termina antes de processar ("Unexpected error during library installation").
      Na versão 1, todas as execuções medidas rodaram em x86_64. O job "PLHDWA · testar controle Db2" mostra a
      máquina e se o driver carregou.
    default: "1"
  ciclo_s:
    description: Segundos entre releituras da pasta, dos limites e dos jobs (a vaga liberada é preenchida na hora)
    default: "5"
  max_horas:
    description: Duração máxima de um lote (segurança)
    default: "10"
  max_threads:
    description: Teto físico de threads do despachante (precisa ser >= max_simult do DESPACHANTE)
    default: "64"
  job_max_arquivos:
    description: O job independente segue com o mesmo objeto até N arquivos e devolve a vaga...
    default: "20"
  job_max_minutos:
    description: ... ou até M minutos
    default: "60"
  limpeza_dat:
    description: >-
      "true" (padrão) = antes da carga, cada DAT passa pela limpeza do cliente (regex de escape e \null), é gravado
      limpo em pasta_tmp/<arquivo>/ e lido com header, delimitador, multiLine e aspas simples; o arquivo limpo é
      apagado no fim. "false" = lê o DAT direto. Cada objeto pode sobrepor com a coluna limpeza da ctl_parametros.
      O modo vem da coluna limpeza_modo da ctl_parametros: CLIENTE (padrão), AUTO, PARALELA, DIRETA, MULTILINHA ou
      SINGLE (o código do cliente, em src/limpeza_single.py).
    default: "true"
  limpeza_pedaco_mb:
    description: >-
      Modo CLIENTE da limpeza: tamanho (MB) dos pedaços do arquivo lidos por tarefa. "0" (padrão) = o do Spark. No
      serverless há um piso de ~16 MB (valores menores dão o mesmo); pedaços pequenos deixam o arquivo grande ~2x mais lento.
    default: "0"
  limpeza_estavel_mb:
    description: >-
      Modo CLIENTE da limpeza: arquivos até este tamanho (MB) gravam antes a posição de cada linha (parquet em
      pasta_tmp/<arquivo>/_posicoes) e as passadas leem dessa cópia, sem depender da divisão do arquivo pelo Spark (que
      muda com o número de núcleos do serverless e dava ERRO_EXECUCAO "os pedaços do arquivo mudaram"). Maiores: leem
      direto e só usam a cópia na nova tentativa, se a divisão mudar. "0" = só na nova tentativa.
    default: "2048"
  precheck_linhas:
    description: Linhas lidas na pré-checagem (header, tipos, detector de formato)
    default: "10000"
  precheck_min_mb:
    description: A partir deste tamanho (MB), todo arquivo faz a pré-checagem completa
    default: "256"
  gatilho_intervalo_s:
    description: Intervalo mínimo entre disparos do gatilho de chegada de arquivo (segundos)
    default: "60"
  vigia_cron:
    description: Agenda do vigia (cron Quartz)
    default: "0 0/15 * * * ?"
  mover_invalido_min:
    description: >-
      Arquivo na pasta de CTL com nome fora do padrão <cod>_[<nomegrupo>_]<nome>_<yyyyMMdd>_<yyyyMMddHHmmss>.CTL há
      mais de N minutos vai para pasta_erro (com o .dat de mesmo nome) e gera o evento NOME_INVALIDO. A espera
      evita mexer num arquivo que ainda está sendo gravado.
    default: "5"
  vigia_retry_espera_s:
    description: >-
      Vigia: espera (s) entre as tentativas de listar a pasta de CTL (3 tentativas) antes de terminar com erro.
    default: "30"
  desempenho_vigia:
    description: >-
      Serverless do vigia: STANDARD (mais barato, arranque mais lento) ou PERFORMANCE_OPTIMIZED.
    default: STANDARD
  desempenho_job_std:
    description: >-
      Serverless do job independente "standard" (objetos com tipo_job = STANDARD): STANDARD ou
      PERFORMANCE_OPTIMIZED. O ambiente interno de testes usa PERFORMANCE_OPTIMIZED para os testes rodarem mais rápido.
    default: STANDARD
  vigia_parado_min:
    description: O vigia dispara o despachante se houver CTL parado há mais de N minutos
    default: "5"

  # ------------------------------------------------------------------ governança
  owner_tag:
    description: Valor da tag OWNER em jobs, tabelas e schema (chave fixa OWNER · pendência U1)
    default: PLHDWA
  grupo_owner:
    description: Usuário/grupo dono da operação (escrita em ctl_execucao, desbloqueio). Vazio = quem fez o deploy
    default: ""
  politica_serverless:
    description: >-
      Id da política serverless (budget policy) aplicada a todos os jobs, para as tags de custo saírem nos recursos.
      Vazio = política padrão do workspace. O run_as precisa ter permissão de uso na política.
    default: ""
  email_alertas:
    description: Lista de e-mails que recebem as falhas dos jobs, por exemplo [a@cliente.com, b@cliente.com]
    type: complex

targets:
  # Modelos: troque o host e os valores <...>. Rode sempre com -t <target>.
  # svc_hash não é definido nos targets: vem do CI/CD (--var svc_hash=<application id> ou BUNDLE_VAR_svc_hash).
  # Antes do 1º deploy, crie o secret scope com o usuário/senha do Db2 (ver README, passo 2).
  dev:
    workspace:
      host: https://<workspace-dev>.cloud.databricks.com
    run_as:
      service_principal_name: ${var.svc_hash}
    variables:
      catalogo: <catalogo_dev>
      landing: s3://<bucket_dev>/<prefixo>
      warehouse_id: <warehouse_id_dev>
      db2_host: <host_db2_dev>
      db2_porta: "<porta>"
      db2_banco: <banco_db2>
      db2_tabela: <SCHEMA>.<TABELA_CONTROLE>
      email_alertas: [<email@cliente>]
      politica_serverless: <id_politica_serverless>
      db2_espera_base_s: "5"          # testes mais rápidos

  hml:
    workspace:
      host: https://<workspace-hml>.cloud.databricks.com
    run_as:
      service_principal_name: ${var.svc_hash}
    variables:
      catalogo: <catalogo_hml>
      landing: s3://<bucket_hml>/<prefixo>
      warehouse_id: <warehouse_id_hml>
      db2_host: <host_db2_hml>
      db2_porta: "<porta>"
      db2_banco: <banco_db2>
      db2_tabela: <SCHEMA>.<TABELA_CONTROLE>
      email_alertas: [<email@cliente>]
      politica_serverless: <id_politica_serverless>

  prd:
    mode: production
    workspace:
      host: https://<workspace-prd>.cloud.databricks.com
    run_as:
      service_principal_name: ${var.svc_hash}
    variables:
      catalogo: <catalogo_prd>
      landing: s3://<bucket_prd>/<prefixo>
      warehouse_id: <warehouse_id_prd>
      db2_host: <host_db2_prd>
      db2_porta: "<porta>"
      db2_banco: <banco_db2>
      db2_tabela: <SCHEMA>.<TABELA_CONTROLE>
      grupo_owner: <grupo_owner_prd>
      email_alertas: [<email@cliente>]
      politica_serverless: <id_politica_serverless>
